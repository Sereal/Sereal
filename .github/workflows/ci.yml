name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go:
          - '1.21'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5'
      - name: Show Perl configuration
        run: perl -V
      - name: Build Perl for tests
        run: |
          cpanm -n Test::LongString
          pushd Perl/Encoder
          perl Makefile.PL
          make
          popd

      - name: Build and test
        run: export GO111MODULE=auto; ./travis/go.sh

  ruby:
    if: false # the 'ruby' job does not currently work
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        ruby:
          - "1.9.3"
          - "2.0.0"
          - "2.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -v

      - run: gem install rake-compiler
      - name: Build and test
        run: cd ruby && rake clean && rake && rake test

  java:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java:
          - "17"
          - "21"
          - "25"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5'
      - name: Show Perl configuration
        run: perl -V
      - name: Build Perl for tests
        run: |
          cpanm -n Test::LongString
          pushd Perl/Encoder
          perl Makefile.PL
          make
          popd

      - name: Build and test
        run: ./travis/java.sh

  perl:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        perl:
          - "5.30"
          - "5.32"
          - "5.34"
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
          - "5.44"
        perl-threaded: [false, true]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.perl-threaded }}

      - name: Build and test
        run: ./travis/perl.sh
